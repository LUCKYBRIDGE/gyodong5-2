plugins {
    id 'com.android.application' version '8.11.1'
}

android {
    namespace 'com.knolquiz.traffic'
    compileSdk 36

    defaultConfig {
        applicationId 'com.knolquiz.traffic'
        minSdk 26
        targetSdk 36
        versionCode 9
        versionName '0.4.4'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
